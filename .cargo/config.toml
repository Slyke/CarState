[alias]
logger-build = "build --manifest-path src/logger/Cargo.toml"
logger-test = "test --manifest-path src/logger/Cargo.toml"
logger-check = "clippy --locked --manifest-path src/logger/Cargo.toml --all-targets -- -D warnings"
logger-fmt = "fmt --manifest-path src/logger/Cargo.toml"
logger-example = "run --manifest-path src/logger/Cargo.toml --example basic"
error-gen = "run --quiet --manifest-path src/logger/Cargo.toml --bin error-gen --"
error-add = "run --quiet --manifest-path src/logger/Cargo.toml --bin error-gen -- --action add"
error-edit = "run --quiet --manifest-path src/logger/Cargo.toml --bin error-gen -- --action edit"
error-delete = "run --quiet --manifest-path src/logger/Cargo.toml --bin error-gen -- --action delete"
error-rm = "run --quiet --manifest-path src/logger/Cargo.toml --bin error-gen -- --action delete"
error-get = "run --quiet --manifest-path src/logger/Cargo.toml --bin error-gen -- --action get"
error-search = "run --quiet --manifest-path src/logger/Cargo.toml --bin error-gen -- --action search"
error-list = "run --quiet --manifest-path src/logger/Cargo.toml --bin error-gen -- --action all"
error-validate = "run --quiet --manifest-path src/logger/Cargo.toml --bin error-gen -- --action validate"
