[package]
name = "carstate"
version = "0.1.0"
edition = "2021"
build = "build.rs"
default-run = "carstate"

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
json5 = "1.3.1"
rand = "0.8"
rumqttc = "0.25.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
styleguide-logger = { path = "src/logger" }
subtle = "2"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "time", "sync", "signal", "test-util"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
tempfile = "3"

[build-dependencies]
serde_json = "1"
