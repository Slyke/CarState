[package]
name = "carstate"
version = "0.1.0"
edition = "2021"
build = "build.rs"
default-run = "carstate"

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
json5 = "1.3.1"
rand = "0.8"
# Use the same Ring provider as the logger; rumqttc's defaults also enable AWS-LC.
rumqttc = { version = "0.25.1", default-features = false, features = ["use-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
styleguide-logger = { path = "src/logger" }
subtle = "2"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "time", "sync", "signal", "test-util"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1"
rcgen = "0.14"
tower = { version = "0.5", features = ["util"] }
tempfile = "3"

[build-dependencies]
serde_json = "1"
