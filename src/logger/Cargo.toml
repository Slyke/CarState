[package]
name = "styleguide-logger"
version = "0.1.0"
edition = "2021"
description = "Reusable structured logging and JSON5 error-code tools"

# This crate is independent of the surrounding application's Cargo workspace.
[workspace]

[lib]
path = "mod.rs"

[[bin]]
name = "error-gen"
path = "bin/error_gen.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
json5 = "1.3.1"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"

[dev-dependencies]
rcgen = "0.14"
